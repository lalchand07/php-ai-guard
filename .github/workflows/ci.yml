name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: ai_guard
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, pdo_sqlite, pdo_mysql, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run tests (including MySQL/MariaDB and concurrency tests)
        env:
          AI_GUARD_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=ai_guard
          AI_GUARD_TEST_MYSQL_USER: root
          AI_GUARD_TEST_MYSQL_PASSWORD: secret
        run: vendor/bin/phpunit

      - name: Run examples in demo mode
        run: |
          php examples/01-basic.php
          php examples/03-travel-whatsapp.php
          php examples/02-reporting.php

  quality:
    name: PHPStan & coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHP-CS-Fixer (PSR-12)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Validate composer.json
        run: composer validate --strict
